skill: secrets-scan
category: security
description: Validates the secrets scanning skill detects leaked credentials

tests:
  - name: "detects common secret patterns"
    trigger_prompts:
      - "scan for secrets"
      - "find leaked credentials"
      - "check for API keys"
    assertions:
      - has_steps: true
      - scans_for: ["API keys", "tokens", "passwords", "private keys"]
      - no_destructive_commands: true

  - name: "checks multiple file types"
    assertions:
      - scans_source_code: true
      - scans_config_files: true
      - scans_ci_configs: true
      - scans_docker_files: true

  - name: "provides remediation steps"
    assertions:
      - output_contains: "rotate"
      - output_contains: ".gitignore"
      - output_contains: "env"

  - name: "handles clean codebase"
    precondition: "no secrets in code"
    assertions:
      - handles_gracefully: true
      - does_not_false_positive_on_examples: true
