name: Site

on:
  pull_request:
    paths: ['site/**', 'skills/**', 'external/**', 'pipelines/**', '.claude-plugin/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'skills/**', 'external/**', 'pipelines/**', '.claude-plugin/**', '.github/workflows/site.yml']

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git dates for "Updated ..."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Translations check
        run: npm run translations:check -- --strict-copy
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (builds with OpenNext via the preview web server)
        run: npm run e2e
      - name: Check no private content
        run: npm run check:private
      # CHROME_PATH is Playwright's Chromium: the exact browser just installed and used by
      # the e2e step, so Lighthouse results do not depend on the runner image's Chrome version.
      - name: Point Lighthouse at Playwright Chromium
        run: echo "CHROME_PATH=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, so Chromium aborts with
      # "No usable sandbox!". Playwright gets by because it launches with --no-sandbox, but Lighthouse does not.
      # Lift the restriction on this throwaway runner instead of turning the sandbox off.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Local budgets: SEO, a11y, CLS and TBT are errors; LCP is only a warning here because
      # the local preview serves JS uncompressed. The mandatory LCP < 2500 ms gate runs
      # against the deployed preview (PR step below).
      - name: Lighthouse (local budgets, LCP warn)
        run: npm run lhci
      - name: Preview (PR)
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # OpenNext's upload populates the remote cache, then runs `wrangler versions upload`; unknown flags such as
          # --preview-alias are passed through to wrangler (a raw wrangler upload would skip populateCache).
          out=$(npx opennextjs-cloudflare upload --preview-alias "pr-${PR_NUMBER}" 2>&1 | tee /dev/stderr)
          url=$(printf '%s' "$out" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | head -1 || true)
          if [ -z "$url" ]; then echo "::error::no preview URL in upload output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR_NUMBER" --body "Preview: $url" --edit-last || gh pr comment "$PR_NUMBER" --body "Preview: $url"
      # lhci does not expand env vars inside JSON, so the "$PREVIEW_URL/..." URLs in
      # lighthouserc.preview.json are placeholders: they are overridden here with
      # --collect.url flags built from the real preview URL.
      - name: Lighthouse (deployed preview, all budgets incl. LCP)
        if: steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          npx lhci autorun --config=lighthouserc.preview.json \
            --collect.url="$PREVIEW_URL/en" \
            --collect.url="$PREVIEW_URL/es/business" \
            --collect.url="$PREVIEW_URL/es/s/legal--contract-review"
      - name: Deploy (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
